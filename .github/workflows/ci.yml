name: Bizzant checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runner toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
